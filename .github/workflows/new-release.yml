name: New Release

on:
  workflow_dispatch:

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  YANDEX_OAUTH_TOKEN: ${{ secrets.YANDEX_OAUTH_TOKEN }}
  YANDEX_REGISTRY_ID: ${{ secrets.YANDEX_REGISTRY_ID }}

jobs:
  lint-test:
    uses: ./.github/workflows/lint-test.yml

  release-branch:
    needs: lint-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Create version tag
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git tag -a v${{ github.run_number }} -m "Release v${{ github.run_number }}"
          git push origin v${{ github.run_number }}

      - name: Create and push release branch
        run: |
          git checkout -b release/${{ github.run_number }}
          git push origin release/${{ github.run_number }}

  docker:
    needs: release-branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/${{ github.run_number }}

      - name: Docker build and push
        run: |
          docker build -t cr.yandex/${{ env.YANDEX_REGISTRY_ID }}/app:${{ github.run_number }} -t cr.yandex/${{ env.YANDEX_REGISTRY_ID }}/app:${{ github.run_number }}_latest .
          echo ${{ env.YANDEX_OAUTH_TOKEN }} | docker login --username oauth --password-stdin cr.yandex
          docker push cr.yandex/${{ env.YANDEX_REGISTRY_ID }}/app:${{ github.run_number }}
          docker push cr.yandex/${{ env.YANDEX_REGISTRY_ID }}/app:${{ github.run_number }}_latest

  create-release-issue:
    needs: release-branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: release/${{ github.run_number }}

      - name: Fetch tags
        run: git fetch --tags

      - name: Define versions (safe tag lookup)
        id: versions
        run: |
          CURRENT=v${{ github.run_number }}
          echo "current=$CURRENT" >> $GITHUB_OUTPUT

          PREV_TAG=$(git tag | grep -E '^v[0-9]+(-fix[0-9]+)?$' | sed 's/^v//' | \
          awk -v curr=${{ github.run_number }} '{split($0,a,"-"); if (a[1] < curr) print $0}' | \
          sort -rV | head -n1)
          
          if [ -n "$PREV_TAG" ]; then
            echo "previous=v$PREV_TAG" >> $GITHUB_OUTPUT
          else
            echo "previous=" >> $GITHUB_OUTPUT
          fi

      - name: Get commits between tags
        id: changelog
        run: |
          CURRENT=${{ steps.versions.outputs.current }}
          PREVIOUS=${{ steps.versions.outputs.previous }}

          if [ -n "$PREVIOUS" ]; then
            LOG=$(git log $PREVIOUS..$CURRENT --pretty=format:'- %h %s (%an)')
            echo "commits<<EOF" >> $GITHUB_OUTPUT
            echo "$LOG" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "commits=- First release" >> $GITHUB_OUTPUT
          fi

      - name: Update CHANGELOG.md in release branch
        run: |
          git checkout release/${{ github.run_number }}

          VERSION="v${{ github.run_number }}"
          DATE=$(date -u +"%Y-%m-%d")
          HEADER="## $VERSION - $DATE"
          COMMITS="${{ steps.changelog.outputs.commits }}"

          {
            echo "$HEADER"
            echo "$COMMITS"
            echo
            if [ -f CHANGELOG.md ]; then
              cat CHANGELOG.md
            fi
          } > _tmp_changelog.md

          mv _tmp_changelog.md CHANGELOG.md

          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add CHANGELOG.md
          git commit -m "docs: update CHANGELOG for $VERSION"
          git push origin release/${{ github.run_number }}

      - name: Create GitHub Issue
        run: |
          gh issue create \
            --title "Release ${{ steps.versions.outputs.current }}" \
            --body "$(cat <<EOF
          ### 🚀 Release Information
          - **Date**: $(date -u +"%Y-%m-%dT%H:%M:%SZ")
          - **Released by**: ${{ github.actor }}
          - **Version**: ${{ steps.versions.outputs.current }}
          - **Docker Image**: cr.yandex/${{ env.YANDEX_REGISTRY_ID }}/app:${{ github.run_number }}

          ### 📜 Changes since ${{ steps.versions.outputs.previous }}
          ${{ steps.changelog.outputs.commits }}

          EOF
          )" \
            --label release
